<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BairroServices - Create Account</title>

    <link rel="stylesheet" href="skill.css">
</head>

<body>

    <div class="register-container">

        <h1>Crie sua Conta</h1>

        <p>Cadastre-se no BairroServices e deixe seus
             vizinhos conhecerem seu negócio ou serviços.</p>

        <form id="registerForm">

            <label>Nome completo</label>
            <input
                type="text"
                id="fullname"
                placeholder="Digite seu Nome"
                required
            >

            <label>Endereço de email</label>
            <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail"
                required
            >

            <label>Número de telefone</label>
            <input
                type="tel"
                id="phone"
                placeholder="Digite seu número de telefone"
                required
            >

            <label>Your Neighborhood</label>
            <input
                type="text"
                id="neighborhood"
                placeholder="e.g. Taboão da Serra"
                required
            >

            <label>O que melhor te descreve?</label>
            <select id="accountType" required>
                <option value="">Escolha o tipo de conta</option>
                <option value="professional">Profissional de Serviço</option>
                <option value="business">dono de pequena empresa</option>
                
            </select>

            <label>SENHA</label>
            <input
                type="password"
                id="password"
                placeholder="Create a password"
                minlength="8"
                required
            >

            <label>Confirmar Senha</label>
            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                minlength="8"
                required
            >

            <button type="submit">Criar conta</button>

        </form>

        <p>
           Já tem uma conta?
            <a href="login.html">Cadastre-se</a>
        </p>

        <a href="first.html">Voltar à página inicial</a>

    </div>

    <script src="register.js"></script>

</body>
</html>
