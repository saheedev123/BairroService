
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perfil do Profissional | BairroServices</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h2>BairroServices</h2>
    <a href="index.html">Inicial</a>
</header>

<main class="profile-page">

    <a href="index.html" class="back-link">← Voltar ao início</a>

    <p id="profileStatus">Carregando perfil...</p>

    <p id="profileError" hidden></p>

    <section id="publicProfile" class="public-profile" hidden>

        <img
            id="profileImage"
            class="public-profile-photo"
            src="images/default-profile.png"
            alt="Foto do profissional"
        >

        <div class="public-profile-content">

            <h1 id="profileName"></h1>

            <p id="profileProfession" class="profile-profession"></p>

            <p id="profileNeighborhood" class="profile-neighborhood"></p>

            <div class="review-summary">
                <span class="review-stars">☆☆☆☆☆</span>
                <span class="review-text">Ainda sem avaliações</span>
            </div>

            <h2>Sobre o profissional</h2>
            <p id="profileDescription"></p>

            <h2>Experiência profissional</h2>
            <p id="profileExperience"></p>

            <a
                id="whatsappButton"
                class="profile-whatsapp"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
            >
                Contactar pelo WhatsApp
            </a>

        </div>

    </section>

</main>

<script src="professional-profile.js"></script>

</body>
</html>
