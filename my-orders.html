
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meus Pedidos | BairroServices</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .my-orders-page {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .orders-heading {
            margin-bottom: 25px;
        }

        .orders-heading h1 {
            color: #173f32;
            margin-bottom: 8px;
        }

        .orders-summary {
            background: #e5efe8;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .orders-summary strong {
            font-size: 28px;
            color: #26734d;
        }

        .order-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
        }

        .order-card h3 {
            color: #173f32;
            margin-bottom: 12px;
        }

        .order-details p {
            margin: 9px 0;
            color: #444;
        }

        .order-status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            background: #fff3cd;
            color: #856404;
            font-size: 13px;
            font-weight: bold;
        }

        .order-date {
            color: #777;
            font-size: 13px;
            margin-top: 15px;
        }

        .orders-empty {
            background: #f5f5f5;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
        }

        .orders-back {
            display: inline-block;
            margin-bottom: 20px;
            color: #26734d;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .my-orders-page {
                padding: 15px;
                margin: 20px auto;
            }

            .order-card {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>BairroServices</h2>
    <a href="customer-dashboard.html">Voltar ao painel</a>
</header>

<main class="my-orders-page">

    <a href="customer-dashboard.html" class="orders-back">
        ← Voltar ao painel
    </a>

    <div class="orders-heading">
        <h1>Meus Pedidos</h1>
        <p>Acompanhe suas solicitações enviadas aos pequenos negócios.</p>
    </div>

    <div class="orders-summary">
        <p>Total de solicitações</p>
        <strong id="totalOrders">0</strong>
    </div>

    <p id="ordersLoading">Carregando suas solicitações...</p>

    <p id="ordersError" hidden></p>

    <div id="ordersContainer"></div>

</main>

<script src="my-orders.js"></script>

</body>
</html>
